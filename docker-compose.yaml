
services:

  web:

    build:
      context: ./web
      #dockerfile: Dockerfile no es necesario si el nombre del archivo es Dockerfile, pero si lo cambias, debes indicarlo aquí.

    container_name: web-iis

    ports:
      - "8000:80"
    volumes:
      - ./web/wwwroot:C:/inetpub/wwwroot #te permitirá editar HTML en VS Code y ver los cambios inmediatamente.

    restart: unless-stopped

    networks:
      - dockerlab

networks:

  dockerlab: