services:

  # ---------------------------------------------------------------
  # Sitio web (IIS) - contenedor Windows
  # ---------------------------------------------------------------
  web:
    build:
      context: ./web
    container_name: web-iis
    ports:
      - "8000:80"
    volumes:
      - ./web/wwwroot:C:/inetpub/wwwroot
    restart: unless-stopped
    networks:
      - dockerlab

  # ---------------------------------------------------------------
  # Microservicio 1: registro-cliente -> POST /registrocliente
  # Para reemplazarlo: cambia el contenido de ./registro-cliente
  # (o el "build.context") sin tocar los otros tres servicios.
  # ---------------------------------------------------------------
  registro-cliente:
    build:
      context: ./registro-cliente
    container_name: registro-cliente
    ports:
      - "5001:8080"
    environment:
      SQL_SERVER: "192.168.100.9" #"host.docker.internal"
      SQL_DATABASE: "DockerWebinar"
      SQL_USER: "sa"
      SQL_PASSWORD: "DockerDemo2026!"
    restart: unless-stopped
    networks:
      - dockerlab

  # ---------------------------------------------------------------
  # Microservicio 2: registro-pago -> POST /registropago
  # ---------------------------------------------------------------
  registro-pago:
    build:
      context: ./registro-pago
    container_name: registro-pago
    ports:
      - "5002:8080"
    environment:
      SQL_SERVER: "192.168.100.9"
      SQL_DATABASE: "DockerWebinar"
      SQL_USER: "sa"
      SQL_PASSWORD: "DockerDemo2026!"
    restart: unless-stopped
    networks:
      - dockerlab

  # ---------------------------------------------------------------
  # Microservicio 3: consulta-clientes -> GET /consultaclientes
  # ---------------------------------------------------------------
  consulta-clientes:
    build:
      context: ./consulta-clientes
    container_name: consulta-clientes
    ports:
      - "5003:8080"
    environment:
      SQL_SERVER: "192.168.100.9"
      SQL_DATABASE: "DockerWebinar"
      SQL_USER: "sa"
      SQL_PASSWORD: "DockerDemo2026!"
    restart: unless-stopped
    networks:
      - dockerlab

  # ---------------------------------------------------------------
  # Microservicio 4: consulta-pagos -> GET /consultapagos
  # ---------------------------------------------------------------
  consulta-pagos:
    build:
      context: ./consulta-pagos
    container_name: consulta-pagos
    ports:
      - "5004:8080"
    environment:
      SQL_SERVER: "192.168.100.9"
      SQL_DATABASE: "DockerWebinar"
      SQL_USER: "sa"
      SQL_PASSWORD: "DockerDemo2026!"
    restart: unless-stopped
    networks:
      - dockerlab

networks:
  dockerlab:
